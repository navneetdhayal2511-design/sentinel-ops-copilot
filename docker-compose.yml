services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=dev-secret-change-me
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - ./backend/data:/app/data

  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api
